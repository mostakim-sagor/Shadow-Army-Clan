<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SHADOW - ARMY !</title>
  </head>
  <body>
    <p>
      Loading SHADOW - ARMY !...
      <a href="/">Open the website</a>
    </p>
    <script>
      fetch("/src/index.html", { cache: "no-store" })
        .then(function (response) {
          if (!response.ok) throw new Error("Website page could not be loaded");
          return response.text();
        })
        .then(function (html) {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          document.body.innerHTML =
            "<p>Website is temporarily unavailable. Please refresh the page.</p>";
        });
    </script>
  </body>
</html>
