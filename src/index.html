<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SHADOW - ARMY ! — Official Clan Website</title>
  <meta name="description" content="Official website of SHADOW - ARMY !, a Clash of Clans clan. Find our clan tag and join our community on Telegram, Messenger, and Discord." />
  <meta name="theme-color" content="#07060b" />

  <!-- Open Graph -->
  <meta property="og:title" content="SHADOW - ARMY !" />
  <meta property="og:description" content="Official clan website and community hub for SHADOW - ARMY !, a Clash of Clans clan." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/shadow.png" />

  <link rel="icon" href="/shadow.png" type="image/png" />
  <link rel="apple-touch-icon" href="/shadow.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <!-- Atmospheric 3D background -->
  <div class="scene" aria-hidden="true">
    <div class="orb orb--a"></div>
    <div class="orb orb--b"></div>
    <div class="orb orb--c"></div>
    <div class="particle-field" id="particleField"></div>
  </div>

  <div class="page">

    <!-- Header -->
    <header class="site-header">
      <div class="site-header__inner">
        <div class="site-header__logo">
          <img src="/shadow.png" alt="SHADOW - ARMY ! clan emblem" />
        </div>
        <span class="site-header__name" id="headerClanName">&nbsp;</span>
      </div>
    </header>

    <!-- Hero -->
    <main class="hero">
      <div class="hero__inner">

        <div class="emblem" id="emblem">
          <div class="emblem__halo"></div>
          <div class="emblem__frame" id="emblemFrame">
            <div class="emblem__ring">
              <img src="/shadow.png" alt="SHADOW - ARMY ! clan emblem" />
            </div>
          </div>
        </div>

        <h1 class="hero__name" id="heroClanName">&nbsp;</h1>

        <div class="tagpill">
          <span class="tagpill__value" id="clanTagValue">&nbsp;</span>
          <button class="tagpill__copy" id="copyTagBtn" type="button" aria-label="Copy clan tag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <span>Copy tag</span>
          </button>
        </div>

        <div class="social-row" id="socialRow">
          <!-- Telegram -->
          <button class="social-btn" type="button" data-platform="telegram" aria-haspopup="dialog">
            <span class="social-btn__icon" style="color:#37AEE2">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 3.5 2.8 10.9c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.4.8.8.8.4 0 .6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.4.2 1.6-.8l3-14.1c.3-1.3-.4-1.9-1.3-1.7Zm-3.2 3.6-7.6 6.9-.3 3.3-1.5-4.6 9.4-5.6Z"/></svg>
            </span>
            <span class="social-btn__text">
              <span class="social-btn__label">Telegram</span>
              <span class="social-btn__sub">Clan chat &amp; updates</span>
            </span>
          </button>

          <!-- Messenger -->
          <button class="social-btn" type="button" data-platform="messenger" aria-haspopup="dialog">
            <span class="social-btn__icon" style="color:#7C5CFF">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.15 2 11.27c0 2.9 1.44 5.49 3.7 7.19V22l3.38-1.86c.9.25 1.87.38 2.92.38 5.52 0 10-4.15 10-9.25S17.52 2 12 2Zm1.02 12.46-2.55-2.72-4.98 2.72 5.48-5.82 2.6 2.72 4.93-2.72-5.48 5.82Z"/></svg>
            </span>
            <span class="social-btn__text">
              <span class="social-btn__label">Messenger</span>
              <span class="social-btn__sub">Quick invite link</span>
            </span>
          </button>

          <!-- Discord -->
          <button class="social-btn" type="button" data-platform="discord" aria-haspopup="dialog">
            <span class="social-btn__icon" style="color:#8f6bff">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 5.7A15.6 15.6 0 0 0 15.1 4.5c-.17.3-.36.72-.5 1.05a14.4 14.4 0 0 0-4.2 0c-.14-.33-.34-.75-.51-1.05A15.5 15.5 0 0 0 6.1 5.7C3.86 9 3.24 12.22 3.55 15.4a15.6 15.6 0 0 0 4.72 2.37c.38-.51.72-1.06 1.01-1.63-.55-.21-1.08-.46-1.58-.76.13-.1.26-.2.39-.3 3.05 1.4 6.35 1.4 9.36 0 .13.11.26.21.39.3-.5.3-1.03.55-1.58.76.29.57.63 1.12 1.01 1.63a15.6 15.6 0 0 0 4.72-2.37c.36-3.68-.6-6.87-2.69-9.7ZM9.7 13.4c-.92 0-1.67-.85-1.67-1.9s.73-1.9 1.67-1.9 1.69.86 1.67 1.9c0 1.05-.74 1.9-1.67 1.9Zm4.62 0c-.92 0-1.67-.85-1.67-1.9s.73-1.9 1.67-1.9 1.69.86 1.67 1.9c0 1.05-.73 1.9-1.67 1.9Z"/></svg>
            </span>
            <span class="social-btn__text">
              <span class="social-btn__label">Discord</span>
              <span class="social-btn__sub">Voice &amp; community server</span>
            </span>
          </button>
        </div>

      </div>
    </main>

    <footer class="site-footer">
      <p id="footerText">&nbsp;</p>
    </footer>
  </div>

  <!-- Copy toast -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast__dot"></span>
    <span id="toastMessage">Clan tag copied!</span>
  </div>

  <!-- Profile modal -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-card" id="modalCard">
      <div class="modal-card__icon" id="modalIcon"></div>
      <p class="modal-card__platform" id="modalPlatform"></p>
      <h2 class="modal-card__name" id="modalName"></h2>
      <p class="modal-card__desc" id="modalDesc"></p>
      <div class="modal-card__actions">
        <a class="btn btn--primary" id="modalViewProfile" href="#" target="_blank" rel="noopener noreferrer">View profile</a>
        <button class="btn btn--ghost" id="modalClose" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="/information.js"></script>
  <script src="/settings.js"></script>
  <script>
    (function () {
      "use strict";

      var INFO = window.CLAN_INFO || {};
      var CFG = window.SETTINGS || {};
      var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* ---------- Populate dynamic content from information.js ---------- */
      function setText(id, value) {
        var el = document.getElementById(id);
        if (el) el.textContent = value;
      }

      setText("headerClanName", INFO.CLAN_NAME);
      setText("heroClanName", INFO.CLAN_NAME);
      setText("clanTagValue", INFO.CLAN_TAG);
      setText("footerText", "© " + INFO.CLAN_NAME + " — All Rights Reserved.");
      document.title = INFO.CLAN_NAME + " — Official Clan Website";

      /* ---------- Ambient particles ---------------------------------- */
      function buildParticles() {
        if (!CFG.ENABLE_PARTICLES || prefersReducedMotion) return;
        var field = document.getElementById("particleField");
        if (!field) return;
        var count = CFG.PARTICLE_COUNT || 20;
        var frag = document.createDocumentFragment();

        for (var i = 0; i < count; i++) {
          var p = document.createElement("span");
          p.className = "particle";
          p.style.left = Math.random() * 100 + "%";
          p.style.top = Math.random() * 100 + "%";
          var duration = 10 + Math.random() * 14;
          p.style.animationDuration = duration.toFixed(2) + "s";
          p.style.animationDelay = (Math.random() * -duration).toFixed(2) + "s";
          p.style.opacity = (0.15 + Math.random() * 0.35).toFixed(2);
          frag.appendChild(p);
        }
        field.appendChild(frag);
      }

      /* ---------- Emblem tilt (pointer-driven 3D) --------------------- */
      function bindTilt() {
        if (!CFG.ENABLE_3D_EFFECTS || !CFG.ENABLE_PARALLAX || prefersReducedMotion) return;
        var emblem = document.getElementById("emblem");
        var frame = document.getElementById("emblemFrame");
        if (!emblem || !frame) return;
        var max = CFG.TILT_MAX_DEGREES || 8;

        emblem.addEventListener("pointermove", function (e) {
          var rect = emblem.getBoundingClientRect();
          var px = (e.clientX - rect.left) / rect.width - 0.5;
          var py = (e.clientY - rect.top) / rect.height - 0.5;
          frame.style.setProperty("--tilt-x", (px * max * 2).toFixed(2) + "deg");
          frame.style.setProperty("--tilt-y", (-py * max * 2).toFixed(2) + "deg");
        });

        emblem.addEventListener("pointerleave", function () {
          frame.style.setProperty("--tilt-x", "0deg");
          frame.style.setProperty("--tilt-y", "0deg");
        });
      }

      /* ---------- Copy clan tag ---------------------------------------- */
      function bindCopy() {
        var btn = document.getElementById("copyTagBtn");
        var toast = document.getElementById("toast");
        var toastMessage = document.getElementById("toastMessage");
        if (!btn) return;
        var hideTimer = null;

        btn.addEventListener("click", function () {
          var tag = INFO.CLAN_TAG || "";

          function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.add("is-visible");
            clearTimeout(hideTimer);
            hideTimer = setTimeout(function () {
              toast.classList.remove("is-visible");
            }, CFG.COPY_NOTIFICATION_DURATION || 2000);
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(tag).then(function () {
              showToast("✓ Clan tag copied!");
            }).catch(function () {
              showToast("Couldn't copy — long-press to select instead");
            });
          } else {
            var temp = document.createElement("textarea");
            temp.value = tag;
            temp.style.position = "fixed";
            temp.style.opacity = "0";
            document.body.appendChild(temp);
            temp.select();
            try {
              document.execCommand("copy");
              showToast("✓ Clan tag copied!");
            } catch (err) {
              showToast("Couldn't copy — long-press to select instead");
            }
            document.body.removeChild(temp);
          }
        });
      }

      /* ---------- Social profile modal --------------------------------- */
      var PLATFORM_META = {
        telegram: {
          name: "Telegram",
          desc: "Official Clan Community",
          url: INFO.TELEGRAM,
          color: "#37AEE2",
          icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 3.5 2.8 10.9c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.4.8.8.8.4 0 .6-.2.9-.5l2.2-2.1 4.6 3.4c.8.5 1.4.2 1.6-.8l3-14.1c.3-1.3-.4-1.9-1.3-1.7Zm-3.2 3.6-7.6 6.9-.3 3.3-1.5-4.6 9.4-5.6Z"/></svg>'
        },
        messenger: {
          name: "Messenger",
          desc: "Official Clan Community",
          url: INFO.MESSENGER,
          color: "#7C5CFF",
          icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.15 2 11.27c0 2.9 1.44 5.49 3.7 7.19V22l3.38-1.86c.9.25 1.87.38 2.92.38 5.52 0 10-4.15 10-9.25S17.52 2 12 2Zm1.02 12.46-2.55-2.72-4.98 2.72 5.48-5.82 2.6 2.72 4.93-2.72-5.48 5.82Z"/></svg>'
        },
        discord: {
          name: "Discord",
          desc: "Official Clan Community",
          url: INFO.DISCORD,
          color: "#8f6bff",
          icon: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 5.7A15.6 15.6 0 0 0 15.1 4.5c-.17.3-.36.72-.5 1.05a14.4 14.4 0 0 0-4.2 0c-.14-.33-.34-.75-.51-1.05A15.5 15.5 0 0 0 6.1 5.7C3.86 9 3.24 12.22 3.55 15.4a15.6 15.6 0 0 0 4.72 2.37c.38-.51.72-1.06 1.01-1.63-.55-.21-1.08-.46-1.58-.76.13-.1.26-.2.39-.3 3.05 1.4 6.35 1.4 9.36 0 .13.11.26.21.39.3-.5.3-1.03.55-1.58.76.29.57.63 1.12 1.01 1.63a15.6 15.6 0 0 0 4.72-2.37c.36-3.68-.6-6.87-2.69-9.7ZM9.7 13.4c-.92 0-1.67-.85-1.67-1.9s.73-1.9 1.67-1.9 1.69.86 1.67 1.9c0 1.05-.74 1.9-1.67 1.9Zm4.62 0c-.92 0-1.67-.85-1.67-1.9s.73-1.9 1.67-1.9 1.69.86 1.67 1.9c0 1.05-.73 1.9-1.67 1.9Z"/></svg>'
        }
      };

      function bindModal() {
        var overlay = document.getElementById("modalOverlay");
        var card = document.getElementById("modalCard");
        var iconEl = document.getElementById("modalIcon");
        var platformEl = document.getElementById("modalPlatform");
        var nameEl = document.getElementById("modalName");
        var descEl = document.getElementById("modalDesc");
        var viewBtn = document.getElementById("modalViewProfile");
        var closeBtn = document.getElementById("modalClose");
        var lastFocused = null;

        function openModal(key) {
          var meta = PLATFORM_META[key];
          if (!meta) return;
          lastFocused = document.activeElement;

          iconEl.innerHTML = meta.icon;
          iconEl.style.color = meta.color;
          platformEl.textContent = meta.name;
          nameEl.textContent = INFO.CLAN_NAME;
          descEl.textContent = meta.desc;
          viewBtn.href = meta.url;

          overlay.classList.add("is-open");
          document.body.style.overflow = "hidden";
          closeBtn.focus();
        }

        function closeModal() {
          overlay.classList.remove("is-open");
          document.body.style.overflow = "";
          if (lastFocused) lastFocused.focus();
        }

        document.querySelectorAll(".social-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            openModal(btn.getAttribute("data-platform"));
          });
        });

        closeBtn.addEventListener("click", closeModal);

        overlay.addEventListener("click", function (e) {
          if (CFG.MODAL_CLOSE_ON_OVERLAY_CLICK && e.target === overlay) {
            closeModal();
          }
        });

        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && CFG.MODAL_CLOSE_ON_ESC && overlay.classList.contains("is-open")) {
            closeModal();
          }
        });
      }

      /* ---------- Init --------------------------------------------------- */
      if (CFG.ENABLE_ANIMATIONS === false) {
        document.body.classList.add("no-animations");
      }

      buildParticles();
      bindTilt();
      bindCopy();
      bindModal();
    })();
  </script>
</body>
</html>
